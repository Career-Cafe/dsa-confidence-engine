- id: dfs
  name: Depth-First Search (DFS)
  parent: graphs
  description: Graph and tree traversal exploring as far as possible along each branch before backtracking.
  aliases:
    - dfs
    - depth first search
    - depth first traversal
  keywords:
    - dfs
