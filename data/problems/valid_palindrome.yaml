id: valid_palindrome
title: Valid Palindrome
description: "Given a string s, return true if it is a palindrome considering only alphanumeric characters and ignoring cases, or false otherwise."
language: python
entrypoint: solve
tests:
  - id: "1"
    input: "{\"s\": \"A man, a plan, a canal: Panama\"}"
    expected_output: "True"
  - id: "2"
    input: "{\"s\": \"race a car\"}"
    expected_output: "False"
  - id: "3"
    input: "{\"s\": \" \"}"
    expected_output: "True"
accepted_strategies:
  - two_pointers_opposite_end
required_concepts:
  - two_pointers
optional_concepts:
  - opposite_end_pointers
  - strings
primary_concepts:
  - two_pointers
