id: two_sum
title: Two Sum
description: "Given an array of integers nums and an integer target, return indices of the two numbers such that they add up to target."
language: python
entrypoint: solve
tests:
  - id: "1"
    input: "{\"nums\": [2, 7, 11, 15], \"target\": 9}"
    expected_output: "[0, 1]"
  - id: "2"
    input: "{\"nums\": [3, 2, 4], \"target\": 6}"
    expected_output: "[1, 2]"
  - id: "3"
    input: "{\"nums\": [3, 3], \"target\": 6}"
    expected_output: "[0, 1]"
accepted_strategies:
  - hashmap_two_sum
required_concepts:
  - hashmap
optional_concepts:
  - arrays
  - iteration
primary_concepts:
  - hashmap
